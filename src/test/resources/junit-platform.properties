# Читаемые имена тестов в отчётах, если @DisplayName не задан.
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# Тесты выполняются последовательно и это осознанный выбор, а не забытая настройка:
# прогон идёт на одном аккаунте Диска, где Корзина и квота — общее состояние,
# а у API есть ограничения на частоту запросов. Параллельный запуск включается так:
#   junit.jupiter.execution.parallel.enabled=true
#   junit.jupiter.execution.parallel.mode.classes.default=concurrent
#   junit.jupiter.execution.parallel.config.strategy=fixed
#   junit.jupiter.execution.parallel.config.fixed.parallelism=2
junit.jupiter.execution.parallel.enabled=false

# Страховка от зависшего сетевого вызова: тест не может выполняться дольше трёх минут.
junit.jupiter.execution.timeout.testable.method.default=3 m
