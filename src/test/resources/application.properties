# Значения по умолчанию. Перекрываются файлом .env, переменными окружения и -D параметрами,
# см. ru.qa.disk.config.TestConfig.
#
# Токен здесь намеренно НЕ указан: секреты не хранятся в репозитории.
# Локально: файл .env в корне проекта (YANDEX_DISK_TOKEN=...).
# В CI: секрет YANDEX_DISK_TOKEN.

yandex.disk.base.uri=https://cloud-api.yandex.net

# Корень песочницы на Диске: все тестовые данные создаются внутри и удаляются после прогона.
yandex.disk.playground.root=disk:/qa-autotests

# Ожидание асинхронных операций Диска (ответ 202 со ссылкой на статус операции).
async.timeout.seconds=60
async.poll.interval.ms=1000
