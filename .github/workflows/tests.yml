name: tests

# push в main и pull request — базовый цикл проверки,
# workflow_dispatch — кнопка «Run workflow» во вкладке Actions.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  offline:
    name: Офлайн-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Эти тесты не требуют ни токена, ни сети: проверяют разбор ответов в модели,
      # JSON-схемы и чтение настроек. Падают быстро и по делу.
      - name: Прогон офлайн-тестов
        run: mvn -B -ntp test -Dgroups=offline

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-reports
          path: |
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: ignore

  api:
    name: Тесты против API Яндекс Диска
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Токен лежит в секретах репозитория (Settings -> Secrets and variables -> Actions).
      # Если секрет не задан, тесты, которым нужен токен, будут пропущены,
      # а проверки авторизации (401) всё равно выполнятся — сборка не упадёт.
      - name: Проверить наличие токена
        run: |
          if [ -z "${{ secrets.YANDEX_DISK_TOKEN }}" ]; then
            echo "::warning::Секрет YANDEX_DISK_TOKEN не задан — тесты с токеном будут пропущены"
          else
            echo "Токен найден, выполняется полный прогон"
          fi

      - name: Прогон API-тестов
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        run: mvn -B -ntp test -Dgroups=api

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: ignore
